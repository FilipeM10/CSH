 <circle cx="912" cy="338" r="39" fill="#00fb7f" opacity=".45" filter="url(#dotGlow)"/>
 <circle cx="912" cy="338" r="25" fill="#00a25a" stroke="#00f182" stroke-width="4"/>
 <circle cx="912" cy="338" r="17" fill="url(#orbGreen)"/>
