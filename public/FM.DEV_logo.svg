<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="135 15 1295 470" width="1295" height="470" role="img" aria-labelledby="logoTitle logoDesc">
<title id="logoTitle">FM.DEV</title>
<desc id="logoDesc">Logotipo vetorial FM.DEV, com monograma FM em azul e verde neon, órbitas tecnológicas e letras DEV brancas. Fundo transparente.</desc>
<defs>
  <linearGradient id="orbit" x1="170" y1="375" x2="970" y2="65" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00e7ef"/><stop offset=".21" stop-color="#0662ff"/><stop offset=".43" stop-color="#01bcff"/><stop offset=".65" stop-color="#01dfe7"/><stop offset=".87" stop-color="#00f784"/><stop offset="1" stop-color="#009755"/></linearGradient>
  <linearGradient id="orbitInner" x1="220" y1="390" x2="970" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#043cff"/><stop offset=".34" stop-color="#008bff"/><stop offset=".62" stop-color="#00eefa"/><stop offset="1" stop-color="#00ed87"/></linearGradient>
  <linearGradient id="blueUpper" x1="336" y1="200" x2="695" y2="187" gradientUnits="userSpaceOnUse"><stop stop-color="#0345f2"/><stop offset=".3" stop-color="#086dff"/><stop offset=".72" stop-color="#00beff"/><stop offset="1" stop-color="#00e4eb"/></linearGradient>
  <linearGradient id="blueLower" x1="323" y1="311" x2="598" y2="276" gradientUnits="userSpaceOnUse"><stop stop-color="#0353f5"/><stop offset=".38" stop-color="#0094fe"/><stop offset=".85" stop-color="#03d6fc"/><stop offset="1" stop-color="#03fcf0"/></linearGradient>
  <linearGradient id="blueLeg" x1="583" y1="384" x2="658" y2="277" gradientUnits="userSpaceOnUse"><stop stop-color="#0048fb"/><stop offset=".6" stop-color="#009aff"/><stop offset="1" stop-color="#00edff"/></linearGradient>
  <linearGradient id="bridge" x1="605" y1="221" x2="846" y2="295" gradientUnits="userSpaceOnUse"><stop stop-color="#048aff"/><stop offset=".18" stop-color="#02b8ff"/><stop offset=".47" stop-color="#00e9ef"/><stop offset=".72" stop-color="#00eba8"/><stop offset="1" stop-color="#00e856"/></linearGradient>
  <linearGradient id="greenStem" x1="796" y1="290" x2="882" y2="285" gradientUnits="userSpaceOnUse"><stop stop-color="#00a778"/><stop offset=".33" stop-color="#00f6a1"/><stop offset=".88" stop-color="#00f455"/><stop offset="1" stop-color="#03b83c"/></linearGradient>
  <linearGradient id="textFill" x1="0" y1="254" x2="0" y2="367" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#eaf0fc"/><stop offset="1" stop-color="#e3ebf5"/></linearGradient>
  <linearGradient id="textStroke" x1="0" y1="260" x2="0" y2="368" gradientUnits="userSpaceOnUse"><stop stop-color="#1497ff"/><stop offset="1" stop-color="#00e7ed"/></linearGradient>
  <radialGradient id="orbCyan" cx=".43" cy=".35" r=".7"><stop stop-color="#fff"/><stop offset=".22" stop-color="#a4ffff"/><stop offset=".54" stop-color="#00f2fc"/><stop offset="1" stop-color="#0076ff"/></radialGradient>
  <radialGradient id="orbGreen" cx=".45" cy=".36" r=".7"><stop stop-color="#ffffff"/><stop offset=".23" stop-color="#b3ffbc"/><stop offset=".5" stop-color="#3dff51"/><stop offset="1" stop-color="#008e58"/></radialGradient>
  <filter id="softGlow" x="-45%" y="-70%" width="190%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="tightGlow" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="dotGlow" x="-110%" y="-110%" width="320%" height="320%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
